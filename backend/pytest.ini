[pytest]
testpaths = tests
asyncio_mode = auto
# Cada teste async ganha seu próprio laço de eventos. Compartilhar o laço entre testes
# faz o pool de conexões do SQLAlchemy guardar conexões de um laço já encerrado, e a
# falha aparece como erro obscuro num teste que não tem nada a ver com a causa.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
