# Migrations do schema `public` — catálogo da plataforma.
# Uso: alembic -c alembic/platform/alembic.ini upgrade head

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../..
path_separator = os

# A URL do banco NÃO fica aqui. O env.py a lê de app.core.config, que lê o .env.
# Repetir a connection string neste arquivo colocaria a senha do banco sob versionamento.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
