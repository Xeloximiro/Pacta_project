# Migrations replicadas em cada schema `tenant_{slug}`.
# Uso: alembic -c alembic/tenant/alembic.ini -x schema=tenant_acme upgrade head
#
# Diferente da linhagem de plataforma, esta roda uma vez por tenant. O schema alvo é
# obrigatório e vem pelo -x; sem ele o env.py aborta em vez de adivinhar um destino.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
